name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint
      run: npm run lint
      
    - name: Test
      run: npm run test
      
    - name: Build
      run: npm run build
      env:
        # Provide any necessary mock environment variables for build
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
        NEXT_TELEMETRY_DISABLED: 1
        UPSTASH_REDIS_REST_URL: "http://localhost:8080"
        UPSTASH_REDIS_REST_TOKEN: "mock-token"
        AI_PROVIDER: "mock"
